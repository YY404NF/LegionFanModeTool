name: 构建

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 推送 v* 标签时创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: 发布
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci.' + $env:GITHUB_RUN_NUMBER }
          dotnet publish LegionFanModeTool.csproj -c Release -o publish -p:Version=$version

      - uses: actions/upload-artifact@v5
        with:
          name: LegionFanModeTool
          path: publish/LegionFanModeTool.exe

      - name: 创建 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/LegionFanModeTool.exe
          generate_release_notes: true
