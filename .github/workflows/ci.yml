name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 推送 v* 标签时创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: 发布
        shell: pwsh
        run: |
          $isTag = $env:GITHUB_REF_TYPE -eq 'tag'
          $version = if ($isTag) { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci.' + $env:GITHUB_RUN_NUMBER }
          $name = "LegionFanModeTool_v$version"
          New-Item dist -ItemType Directory | Out-Null

          # 依赖已安装的 Windows App SDK 运行时
          dotnet publish LegionFanModeTool.csproj -c Release -o out/fd -p:Version=$version
          Copy-Item out/fd/LegionFanModeTool.exe "dist/$name.exe"

          # 自带 Windows App SDK 运行时，开箱即用；两种发布方式的中间文件不能混用，先清掉
          Remove-Item bin, obj -Recurse -Force
          dotnet publish LegionFanModeTool.csproj -c Release -o out/sc -p:Version=$version -p:WindowsAppSDKSelfContained=true -p:IncludeAllContentForSelfExtract=true
          Copy-Item out/sc/LegionFanModeTool.exe "dist/${name}_with_runtime.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: LegionFanModeTool
          path: dist/*.exe

      - name: 创建 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*.exe
          generate_release_notes: true
